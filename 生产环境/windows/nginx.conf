# ============================================
# Nginx 配置（Windows 版本）
# 作用：反向代理 + 静态资源缓存 + 端口 80 入口
# 将此文件放到 Nginx 安装目录的 conf\nginx.conf
# ============================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # 日志
    access_log  logs/access.log;
    error_log   logs/error.log;

    # 上游：Flask waitress 服务
    upstream flask_app {
        server 127.0.0.1:5000;
    }

    server {
        listen       80;
        server_name  localhost;

        # 静态资源（Flask templates 等，直接由 Nginx 处理更快）
        location /static/ {
            alias  E:/works/l刘海忠项目/s孙总节能/j江西水厂/二次8水厂资料（2026年6月9日085215）/二次8水厂/二班项目/会昌/k开发/z主题软件开发/app/static/;
            expires 1h;
        }

        # 反向代理到 Flask
        location / {
            proxy_pass         http://flask_app;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
