# ============================================
# Nginx 配置（Linux 生产环境）
# 放到: /etc/nginx/sites-available/water-plant
# ============================================

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/water-plant-access.log;
    error_log  /var/log/nginx/water-plant-error.log;

    # 静态资源
    location /static/ {
        alias /opt/water-plant/app/static/;
        expires 1h;
    }

    # 反向代理到 gunicorn
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
